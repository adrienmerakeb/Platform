<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host | WanderPal</title>

  <!-- Icons -->
  <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>

  <!-- Shared styles (keep your filename as-is) -->
  <link rel="stylesheet" href="/css/common login & registration.css" />

  <!-- i18n -->
  <script src="/js/i18n.js" defer></script>

  <style>
    /* Services grid */
    .services{display:grid;grid-template-columns:1fr;gap:8px}
    .services label{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.35);padding:10px 12px;border-radius:10px}

    /* Start hidden */
    #servicesField {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-6px);
      transition:
        max-height 1.5s cubic-bezier(.22,.61,.36,1),
        opacity 1.5s cubic-bezier(.22,.61,.36,1),
        transform 1.5s cubic-bezier(.22,.61,.36,1);
    }
    /* Reveal when sector selected (requires :has support) */
    #sectorField:has(#hostType:valid) + #servicesField {
      max-height: 500px;
      opacity: 1;
      transform: translateY(0);
    }
    /* Force-close to retrigger animation */
    #servicesField.closing{
      max-height:0 !important;
      opacity:0 !important;
      transform:translateY(-6px) !important;
    }
  </style>
</head>
<body>
  <!-- Language -->
  <div class="lang-switch" aria-label="Language selector">
    <label for="lang" id="lang-label" data-i18n="langLabel">Language</label>
    <select id="lang">
      <option value="fr">Français</option>
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="zh">中文</option>
      <option value="hi">हिन्दी</option>
      <option value="ar">العربية</option>
      <option value="pt">Português</option>
      <option value="ru">Русский</option>
      <option value="bn">বাংলা</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="ja">Japanese</option>
      <option value="ko">Korean</option>
      <option value="pl">Polish</option>
      <option value="de">German</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ไทย</option>
      <option value="km">ភាសាខ្មែរ</option>
      <option value="nl">Nederlands</option>
      <option value="it">Italiano</option>
      <option value="tr">Türkçe</option>
      <option value="el">Ελληνικά</option>
    </select>
  </div>

  <main class="card">
    <div class="viewport">
      <div class="slider" id="slider">

        <!-- LOGIN -->
        <section class="panel">
          <div class="pad">
            <h2 data-i18n="hostLogin">Host — Login</h2>
            <form class="form" id="loginForm">
              <div class="field">
                <input class="input" id="login-company" type="text"
                       placeholder="Your company name" data-ph="companyName" required />
                <span class="icon-right"><ion-icon name="business"></ion-icon></span>
              </div>

              <div class="field">
                <input class="input" id="login-email" type="email"
                       placeholder="Email address" data-ph="email" required />
                <span class="icon-right"><ion-icon name="mail"></ion-icon></span>
              </div>

              <div class="field">
                <div class="password-wrapper">
                  <input class="input" id="login-pass" type="password"
                         placeholder="Password" data-ph="password" required />
                  <button type="button" class="toggle"
                          onclick="togglePassword('login-pass', this)"
                          aria-label="Show password">◎</button>
                  <span class="icon-right"><ion-icon name="lock"></ion-icon></span>
                </div>
              </div>

              <div class="row">
                <label class="remember">
                  <input type="checkbox" id="remember"/> <span data-i18n="remember">Remember me</span>
                </label>
                <a class="link" href="#" id="forgot-link" data-i18n="forgot">Forgot password</a>
              </div>

              <button class="primary" type="submit" data-i18n="loginBtn">Login</button>
              <p class="muted">
                <span data-i18n="noAccount">No account?</span>
                <a class="link" href="#" id="toRegister" data-i18n="signup">Sign up</a>
              </p>
            </form>
          </div>
        </section>

        <!-- REGISTER -->
        <section class="panel">
          <div class="pad">
            <h2 data-i18n="hostRegister">Host — Register</h2>
            <form class="form" id="registerForm">
              <div class="field">
                <input class="input" id="company" type="text"
                       placeholder="Company name" data-ph="companyName" required />
                <span class="icon-right"><ion-icon name="business"></ion-icon></span>
              </div>

              <div class="field">
                <input class="input" id="website" type="url"
                       placeholder="Official website" data-ph="website" />
                <span class="icon-right"><ion-icon name="globe"></ion-icon></span>
              </div>

              <!-- Optional VAT (kept off by default)
              <div class="field">
                <input class="input" id="vat" type="text"
                       placeholder="VAT / Tax ID (optional)" data-ph="vatOptional" />
              </div>
              -->

              <!-- Sector -->
              <div class="field" id="sectorField">
            <!--<label class="label" data-i18n="sectorLabel">Sector</label> -->
                <select id="hostType" required>
                  <option value="" data-i18n="chooseSector">Choose sector</option>
                  <option value="museum"     data-i18n="sector_museum">Museum / Gallery / Monument</option>
                  <option value="doctor"     data-i18n="sector_doctor">Doctor / Clinic / Dentist</option>
                  <option value="salon"      data-i18n="sector_salon">Beauty / Spa / Hairdresser</option>
                  <option value="event"      data-i18n="sector_event">Event Organizer / Venue</option>
                  <option value="restaurant" data-i18n="sector_restaurant">Restaurant / Café / Bar</option>
                  <option value="hotel"      data-i18n="sector_hotel">Hotel / Guesthouse / BnB</option>
                  <option value="retail"     data-i18n="sector_retail">Shop / Store / Mall</option>
                  <option value="sports"     data-i18n="sector_sports">Sports center / Gym / Stadium</option>
                  <option value="public"     data-i18n="sector_public">Public admin / Bank / Post office</option>
                  <option value="other"      data-i18n="sector_other">Other</option>
                </select>
              </div>

              <div class="field" id="servicesField">
                <span class="label" data-i18n="recommendedServices">Recommended services</span>
                <div class="services" id="serviceOptions"></div>
              </div>

              <div class="field">
                <input class="input" id="reg-email" type="email"
                       placeholder="Email address" data-ph="email" required />
                <span class="icon-right"><ion-icon name="mail"></ion-icon></span>
              </div>

              <div class="field">
                <div class="password-wrapper">
                  <input class="input" id="reg-pass" type="password"
                         placeholder="Create a password" data-ph="createPassword" required />
                  <button type="button" class="toggle"
                          onclick="togglePassword('reg-pass', this)"
                          aria-label="Show password">◎</button>
                  <span class="icon-right"><ion-icon name="lock"></ion-icon></span>
                </div>
              </div>

              <button class="primary" type="submit" data-i18n="registerBtn">Register</button>
              <p class="muted">
                <span data-i18n="haveAccount">Already have an account?</span>
                <a class="link" href="#" id="toLogin" data-i18n="signin">Sign in</a>
              </p>
            </form>
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- Forgot password modal -->
  <div class="backdrop" id="forgot-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="forgot-title">
      <h3 id="forgot-title" data-i18n="hostForgotTitle">Reset Host Password</h3>
      <p class="muted" style="margin:0 0 8px;opacity:.85" data-i18n="hostForgotDesc">
        You’ll receive a password reset link if this email is registered as a host.
      </p>
      <div class="field" style="margin-top:10px">
        <label class="label" for="forgot-email" data-i18n="email">Email</label>
        <input class="input" id="forgot-email" type="email"
               placeholder="you@company.com" data-ph="emailPlaceholder" required />
        <span class="icon-right"><ion-icon name="mail"></ion-icon></span>
      </div>
      <div class="actions">
        <button class="btn ghost" id="forgot-cancel" data-i18n="forgotCancel">Cancel</button>
        <button class="btn primary" id="forgot-send" data-i18n="forgotSend">Send</button>
      </div>
    </div>
  </div>

  <script>
    // slide between login/register
    const slider = document.getElementById('slider');
    document.getElementById('toRegister').onclick = (e)=>{ e.preventDefault(); slider.style.transform='translateX(-50%)'; };
    document.getElementById('toLogin').onclick    = (e)=>{ e.preventDefault(); slider.style.transform='translateX(0%)';  };

    // service suggestions by sector
    const serviceOptions = document.getElementById('serviceOptions');
    const hostTypeSelect = document.getElementById('hostType');

    const allowedServices = {
      museum: ["In-Time - Virtual queuing services","Let’s Get Out - Tour guiding services","My events - Events organizing services","Cool Stuff - Promos & discounts management services"],
      doctor: ["In-Time - Virtual queuing services"],
      salon: ["In-Time - Virtual queuing services","Cool Stuff - Promos & discounts management services"],
      event: ["My events - Events organizing services","Cool Stuff - Promos & discounts management services"],
      restaurant: ["In-Time - Virtual queuing services","Cool Stuff - Promos & discounts management services"],
      hotel: ["In-Time - Virtual queuing services","My events - Events organizing services","Cool Stuff - Promos & discounts management services"],
      retail: ["Cool Stuff - Promos & discounts management services","My events - Events organizing services"],
      sports: ["In-Time - Virtual queuing services","My Events - Events organizing services","Cool Stuff - Promos & discounts management services"],
      public: ["In-Time - Virtual queuing services"],
      other: ["In-Time - Virtual queuing services","Cool Stuff - Promos & discounts management services"]
    };

    hostTypeSelect.addEventListener('change', ()=>{
      const type = hostTypeSelect.value;
      serviceOptions.innerHTML = '';
      const list = allowedServices[type] || [];
      if (!list.length) {
        serviceOptions.innerHTML='<em style="opacity:.7" data-i18n="selectSectorHint">Select a sector…</em>';
        return;
      }
      list.forEach(s=>{
        const id = 'srv-'+s.replace(/\s+/g,'').toLowerCase();
        const row = document.createElement('label');
        row.innerHTML = `<input type="checkbox" value="${s}" id="${id}"/> ${s}`;
        serviceOptions.appendChild(row);
      });
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const selected = Array.from(document.querySelectorAll('#serviceOptions input:checked')).map(x=>x.value);

      const payload = {
        company_name: document.getElementById('company')?.value?.trim(),
        website: document.getElementById('website')?.value?.trim() || null,
        vat_id: document.getElementById('vat')?.value?.trim() || null,
        host_type: document.getElementById('hostType')?.value,
        selected_services: selected,
        email: document.getElementById('reg-email')?.value?.trim(),
        password: document.getElementById('reg-pass')?.value
      };

      if (!payload.company_name) return alert('Company is required');
      if (!payload.email)        return alert('Email is required');
      if (!payload.password)     return alert('Password is required');
      if (!payload.host_type)    return alert('Sector is required');
      if (!payload.selected_services.length) return alert('Select at least one service');

      try {
        const res = await fetch('/api/host/register', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(()=> ({}));
        if (!res.ok || !data.ok) {
          return alert(data.error || `Registration failed (HTTP ${res.status})`);
        }
        alert('Host registered successfully.');
        slider.style.transform = 'translateX(0%)';
        e.target.reset();
        serviceOptions.innerHTML = '<em style="opacity:.7" data-i18n="selectSectorHint">Select a sector…</em>';
      } catch (err) {
        console.error('[HOST] register fetch error:', err);
        alert('Network or server error while registering host.');
      }
    });


// Login (HOST)
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const payload = {
    company_name: document.getElementById('login-company').value.trim(),
    email:        document.getElementById('login-email').value.trim(),
    password:     document.getElementById('login-pass').value,
    remember:     document.getElementById('remember').checked
  };

  try {
    const res = await fetch('/api/host/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',           // 🔑 make sure host JWT cookie is set
      body: JSON.stringify(payload)
    });

    const data = await res.json().catch(() => ({}));

    if (res.status === 403) {
      alert(data.error || 'This account is suspended. Please contact abc@hotmail.com.');
      return;
    }

    if (res.ok && data.ok) {
      // 🔁 Go directly to the host dashboard, not visitor dashboard
      window.location.href = '/dashboard-host.html';
    } else {
      alert(data.error || 'Identifiants invalides / Invalid credentials');
    }
  } catch (err) {
    console.error('[HOST login] error:', err);
    alert('Network error');
  }
});




    // Forgot password (HOST)
    (() => {
      const forgotLink  = document.getElementById('forgot-link');
      const forgotModal = document.getElementById('forgot-modal');
      const forgotCancel= document.getElementById('forgot-cancel');
      const forgotSend  = document.getElementById('forgot-send');
      const forgotEmail = document.getElementById('forgot-email');
      if (!forgotLink || !forgotModal || !forgotCancel || !forgotSend || !forgotEmail) return;

      forgotLink.addEventListener('click', (e) => {
        e.preventDefault();
        forgotModal.style.display = 'flex';
        forgotEmail.focus();
      });
      forgotCancel.addEventListener('click', () => {
        forgotModal.style.display = 'none';
      });

      forgotSend.addEventListener('click', async () => {
        const email = (forgotEmail.value || '').trim();
        if (!email) return;

        try {
          const r = await fetch('/api/host/forgot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok) {
            alert(j.error || 'Could not send reset link.');
            return;
          }
          if (j.resetUrl) console.log('[DEV host reset URL]', j.resetUrl);
          alert('If an account exists, we’ve sent a reset link.');
          forgotModal.style.display = 'none';
          forgotEmail.value = '';
        } catch (err) {
          console.error('[HOST forgot] network error:', err);
          alert('We couldn’t process your request.');
        }
      });
    })();

    // Toggle password visibility
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? '◉' : '◎';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      input.focus();
    }

    // Fold pulse (if you keep the :has() CSS)
    const sel   = document.getElementById('hostType');
    const panel = document.getElementById('servicesField');
    sel.addEventListener('change', () => {
      if (!sel.value) { panel.classList.add('closing'); return; }
      panel.classList.add('closing');
      void panel.offsetHeight;
      requestAnimationFrame(() => { panel.classList.remove('closing'); });
    });

    // i18n init for Partner page
    window.addEventListener('load', function () {
      I18N.initSelect(document.getElementById('lang'), {
        titleKeys: ['hostTitle','loginTitle'] // or partner
      });
    });

  </script>
</body>
</html>
