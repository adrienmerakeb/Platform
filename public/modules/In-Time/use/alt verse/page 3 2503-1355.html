<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Book a spot — In-Time</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#7c3aed;--v-s:#ede9fc;--v-d:#6d28d9;
  --blue:#2563eb;--blue-s:#eff6ff;
  --green:#16a34a;--green-s:#f0fdf4;
  --amber:#d97706;--amber-s:#fffbeb;
  --red:#dc2626;--red-s:#fef2f2;
  --txt:#1a1825;--muted:#6b6880;--hint:#9b98aa;
  --surf:#fff;--bg:#f4f3f8;--bord:#e2e0ea;--bord-f:#7c3aed;
  --gray:#f0eff5;--gray-m:#d4d2de;
  --r:14px;--ri:9px;
  --sh:0 2px 16px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05);
  --ring:0 0 0 3px rgba(124,58,237,.18);
  --font:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55}
.shell{max-width:560px;margin:0 auto;padding:84px 18px 120px}

/* ── Hero card ─────────────────────────────────────────── */
.hero{
  background:linear-gradient(135deg,var(--v) 0%,var(--v-d) 100%);
  border-radius:var(--r);padding:20px 20px 18px;margin-bottom:18px;
  color:#fff;position:relative;overflow:hidden;
  box-shadow:0 6px 24px rgba(124,58,237,.3);
}
.hero::before{
  content:'';position:absolute;top:-40px;right:-40px;
  width:160px;height:160px;border-radius:50%;
  background:rgba(255,255,255,.07);pointer-events:none;
}
.hero-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.18);border-radius:999px;
  padding:3px 10px;margin-bottom:10px;
}
.hero h1{font-size:20px;font-weight:700;margin-bottom:4px}
.hero-sub{font-size:13px;opacity:.85;margin-bottom:2px}
.hero-addr{font-size:12px;opacity:.65}
.hero-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hero-pill{
  font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:999px;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);
}

/* ── Section label ──────────────────────────────────────── */
.sec-lbl{font-size:13px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;margin-top:4px}

/* ── Date picker ────────────────────────────────────────── */
.date-row{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 16px;
}
.date-row label{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.date-row input[type=date]{
  flex:1;border:1.5px solid var(--bord);border-radius:var(--ri);
  padding:8px 11px;font-family:var(--font);font-size:14px;color:var(--txt);
  background:var(--surf);outline:none;transition:border-color .18s,box-shadow .18s;
}
.date-row input:focus{border-color:var(--bord-f);box-shadow:var(--ring)}

/* ── Wave scroller ──────────────────────────────────────── */
.wave-outer{
  display:flex;align-items:center;gap:8px;margin-bottom:18px;
}
.wave-scroll{
  flex:1;display:flex;gap:10px;
  overflow-x:auto;padding:6px 2px 10px;
  scroll-snap-type:x mandatory;scrollbar-width:none;
}
.wave-scroll::-webkit-scrollbar{display:none}
.nav-arr{
  flex-shrink:0;width:32px;height:32px;border-radius:50%;
  border:1.5px solid var(--bord);background:var(--surf);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;color:var(--muted);transition:all .15s;
}
.nav-arr:hover{background:var(--gray);border-color:var(--v);color:var(--v)}

.wave-card{
  min-width:130px;max-width:150px;flex:0 0 auto;
  scroll-snap-align:center;
  background:var(--surf);border:1.5px solid var(--bord);border-radius:var(--r);
  padding:12px 12px 10px;cursor:pointer;
  transition:border-color .15s,box-shadow .15s,transform .12s;
  position:relative;
}
.wave-card:hover{border-color:var(--v);transform:translateY(-2px);box-shadow:0 6px 18px rgba(124,58,237,.12)}
.wave-card.sel{border-color:var(--v);background:var(--v-s);box-shadow:0 6px 18px rgba(124,58,237,.18);transform:translateY(-2px)}
.wave-card.full{opacity:.45;pointer-events:none}
.wave-card.now-tag::after{
  content:'Now';position:absolute;top:8px;right:8px;
  font-size:10px;font-weight:700;color:var(--v);background:var(--v-s);
  border-radius:999px;padding:1px 7px;
}
.wave-time{font-size:15px;font-weight:700;color:var(--txt);margin-bottom:2px}
.wave-window{font-size:11.5px;color:var(--muted)}
.wave-rem{font-size:12px;color:var(--muted);margin-top:6px}
.wave-rem strong{color:var(--txt)}
.wave-count{
  position:absolute;bottom:10px;right:10px;
  width:24px;height:24px;border-radius:50%;
  background:var(--v);color:#fff;
  font-size:12px;font-weight:700;
  display:none;align-items:center;justify-content:center;
}
.wave-card.sel .wave-count{display:flex}
.wave-controls{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-top:8px;
}
.wave-controls button{
  width:28px;height:28px;border-radius:50%;
  border:1.5px solid var(--bord);background:var(--surf);
  font-size:16px;font-weight:700;cursor:pointer;line-height:1;
  transition:all .12s;display:flex;align-items:center;justify-content:center;
}
.wave-controls button:hover{background:var(--v);border-color:var(--v);color:#fff}

/* ── Party size (D/B arch) ──────────────────────────────── */
.party-row{
  background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;
}
.party-lbl strong{display:block;font-size:14px;font-weight:600;color:var(--txt)}
.party-lbl small{font-size:12px;color:var(--muted)}
.party-ctrl{display:flex;align-items:center;gap:10px}
.ps-btn{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bord);
  background:var(--surf);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;transition:all .12s;line-height:1;
}
.ps-btn:hover{background:var(--v);border-color:var(--v);color:#fff}
.ps-val{font-size:22px;font-weight:700;color:var(--v);min-width:32px;text-align:center}

/* ── Selection summary card ─────────────────────────────── */
.sel-card{
  background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px 18px;margin-bottom:14px;
}
.sel-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bord)}
.sel-row:last-child{border-bottom:none}
.sel-key{font-size:13px;color:var(--muted);font-weight:500}
.sel-val{font-size:13.5px;font-weight:700;color:var(--txt)}
.sel-val.empty{color:var(--hint);font-weight:400}

/* ── Booking button ─────────────────────────────────────── */
.book-btn{
  width:100%;padding:14px;border:none;border-radius:var(--r);
  background:var(--v);color:#fff;font-family:var(--font);font-size:15px;font-weight:700;
  cursor:pointer;transition:background .18s,transform .1s;
  box-shadow:0 4px 18px rgba(124,58,237,.28);
}
.book-btn:hover{background:var(--v-d)}
.book-btn:active{transform:scale(.98)}
.book-btn:disabled{opacity:.4;pointer-events:none}

/* ── Confirmation screen ────────────────────────────────── */
.conf-screen{display:none}
.conf-card{
  background:var(--surf);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--sh);padding:28px 22px;text-align:center;margin-bottom:16px;
}
.conf-ico{font-size:48px;margin-bottom:12px}
.conf-title{font-size:20px;font-weight:700;color:var(--green);margin-bottom:6px}
.conf-sub{font-size:13.5px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.code-pill{
  display:inline-block;font-size:22px;font-weight:700;letter-spacing:.12em;
  color:var(--v);background:var(--v-s);border:1.5px solid var(--v);
  border-radius:var(--ri);padding:10px 24px;margin-bottom:8px;
}
.conf-qr{max-width:180px;border-radius:var(--ri);border:1px solid var(--bord);margin:12px auto 0;display:block}
.conf-hint{font-size:12px;color:var(--hint);margin-top:8px}

/* ── Error / loading states ─────────────────────────────── */
.errbar{background:var(--red-s);border:1.5px solid #fca5a5;border-radius:var(--ri);
  padding:10px 14px;font-size:13px;color:var(--red);font-weight:500;
  margin-bottom:14px;display:none}
.errbar.on{display:block}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px}

/* Toast */
#toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(10px);
  background:rgba(26,24,37,.9);color:#fff;padding:8px 18px;border-radius:999px;
  font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:200;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body class="has-top-band has-bottom-band">
<header class="site"><div class="title">Book a Spot</div></header>

<div class="shell">

  <!-- Hero -->
  <div class="hero" id="hero">
    <div class="hero-tag">🕐 In-Time</div>
    <h1 id="heroTitle">Loading queue…</h1>
    <div class="hero-sub" id="heroSub"></div>
    <div class="hero-addr" id="heroAddr"></div>
    <div class="hero-pills" id="heroPills"></div>
  </div>

  <div class="errbar" id="errbar"></div>

  <!-- Main booking UI (shown after load) -->
  <div id="bookingUI" style="display:none">

    <!-- Date picker (advance booking) -->
    <div id="dateSection" style="display:none">
      <div class="date-row">
        <label for="datePicker">📅 Date</label>
        <input type="date" id="datePicker">
      </div>
    </div>

    <!-- Wave / slot selection (arch C or ADVANCE A/B) -->
    <div id="waveSection" style="display:none">
      <div class="sec-lbl" id="waveLabel">Available time slots</div>
      <div class="wave-outer">
        <button class="nav-arr" id="waveLeft" title="Scroll left">◀</button>
        <div class="wave-scroll" id="waveScroll"></div>
        <button class="nav-arr" id="waveRight" title="Scroll right">▶</button>
      </div>
    </div>

    <!-- Party size (all archetypes) -->
    <div class="party-row">
      <div class="party-lbl">
        <strong>Party size</strong>
        <small>How many people?</small>
      </div>
      <div class="party-ctrl">
        <button class="ps-btn" id="psMinus" onclick="adjustPS(-1)">−</button>
        <div class="ps-val" id="psVal">1</div>
        <button class="ps-btn" id="psPlus"  onclick="adjustPS(+1)">+</button>
      </div>
    </div>

    <!-- Selection summary -->
    <div class="sel-card" id="selCard">
      <div class="sel-row">
        <span class="sel-key">Queue</span>
        <span class="sel-val" id="selQueue">—</span>
      </div>
      <div class="sel-row" id="selDateRow" style="display:none">
        <span class="sel-key">Date</span>
        <span class="sel-val" id="selDate">—</span>
      </div>
      <div class="sel-row" id="selTimeRow" style="display:none">
        <span class="sel-key">Time slot</span>
        <span class="sel-val" id="selTime">—</span>
      </div>
      <div class="sel-row">
        <span class="sel-key">Party size</span>
        <span class="sel-val" id="selPS">1</span>
      </div>
    </div>

    <button class="book-btn" id="bookBtn" onclick="confirmBooking()" disabled>
      Confirm booking →
    </button>

  </div><!-- /bookingUI -->

  <!-- Confirmation (replaces booking UI after success) -->
  <div class="conf-screen" id="confScreen">
    <div class="conf-card">
      <div class="conf-ico">🎉</div>
      <div class="conf-title">Booking confirmed!</div>
      <div class="conf-sub" id="confSub">Your spot is reserved.</div>
      <div class="code-pill" id="confCode">—</div>
      <div class="conf-hint">Show this code or QR at the venue.</div>
      <img class="conf-qr" id="confQr" src="" alt="Booking QR" style="display:none">
    </div>
    <button class="book-btn" onclick="bookAnother()" style="margin-bottom:10px">
      Book another spot
    </button>
    <button class="book-btn" style="background:var(--gray);color:var(--txt);box-shadow:none;border:1.5px solid var(--bord)"
      onclick="location.href='/modules/In-Time/use/page 1.html'">
      My bookings →
    </button>
  </div>

</div><!-- /shell -->

<div id="toast"></div>

<script src="/js/drawer.js"></script>
<script src="/js/fab.js"></script>
<script>
'use strict';

/* ── URL params ─────────────────────────────────────────── */
const params   = new URLSearchParams(location.search);
const queueId  = params.get('queueId') || params.get('queue_id');
const nameHint = params.get('name') || '';
const addrHint = params.get('addr') || '';

if(!queueId){
  document.getElementById('errbar').textContent = 'No queue ID in URL. Please scan a QR code again.';
  document.getElementById('errbar').classList.add('on');
}

/* ── State ──────────────────────────────────────────────── */
let queue        = null;   // loaded from API
let waves        = [];     // [{start,stop,label,capacity,remaining,booked,el}]
let selectedWave = null;
let partySize    = 1;
const MAX_PS     = 5;

/* ── Helpers ────────────────────────────────────────────── */
let _tt;
function toast(msg,ms=2500){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('show'),ms);
}
function setErr(msg){ const e=document.getElementById('errbar'); e.textContent=msg||''; e.classList.toggle('on',!!msg); }
function esc(s){ const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML; }

function todayISO(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getDeviceId(){
  let id=localStorage.getItem('intime_device_id');
  if(!id){ id=crypto.randomUUID(); localStorage.setItem('intime_device_id',id); }
  return id;
}

/* ── Party size ─────────────────────────────────────────── */
function adjustPS(delta){
  partySize = Math.max(1, Math.min(MAX_PS, partySize + delta));
  document.getElementById('psVal').textContent = partySize;
  document.getElementById('selPS').textContent = partySize;
  updateBookBtn();
}

/* ── Date picker ────────────────────────────────────────── */
function initDatePicker(formula){
  const dp = document.getElementById('datePicker');
  const today = todayISO();
  dp.min = today;
  dp.value = today;
  dp.addEventListener('change', ()=>{
    selectedWave = null;
    if(queue) buildWaves(queue);
  });
  if(formula !== 'LIVE_ONLY'){
    document.getElementById('dateSection').style.display = '';
    document.getElementById('selDateRow').style.display = '';
  }
}

function getSelectedDate(){
  const v = document.getElementById('datePicker').value;
  return v || todayISO();
}

/* ── Wave / slot building ───────────────────────────────── */
function tMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function toHHMM(min){ return `${String(Math.floor(min/60)).padStart(2,'0')}:${String(min%60).padStart(2,'0')}`; }

function buildWaves(q){
  const waveScroll = document.getElementById('waveScroll');
  const label      = document.getElementById('waveLabel');
  label.textContent = q.archetype==='C' ? 'Available waves' : 'Available time slots';

  /* Get wave config from schema (wave_config_json) */
  let openMin=9*60, closeMin=18*60, cadence=15, cap=40;
  if(q.wave_config_json){
    const wc = typeof q.wave_config_json==='string' ? JSON.parse(q.wave_config_json) : q.wave_config_json;
    if(wc.wave_duration) cadence = Number(wc.wave_duration);
    if(wc.wave_capacity) cap     = Number(wc.wave_capacity);
  }
  /* Fall back to schedule_json for open/close times */
  if(q.schedule_json){
    const sc = typeof q.schedule_json==='string' ? JSON.parse(q.schedule_json) : q.schedule_json;
    if(sc.globalOpen)  openMin  = tMin(sc.globalOpen);
    if(sc.globalClose) closeMin = tMin(sc.globalClose);
    /* Day-specific overrides */
    const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const dayName=dayNames[new Date(getSelectedDate()+'T12:00:00').getDay()];
    const dayConfig=sc.days?.find(d=>d.n===dayName);
    if(dayConfig){
      if(!dayConfig.on){ waveScroll.innerHTML='<div style="padding:16px;color:var(--muted);font-size:13px">This queue is closed on this day.</div>'; waves=[]; return; }
      if(!sc.sameHours){ openMin=tMin(dayConfig.open||'09:00'); closeMin=tMin(dayConfig.close||'17:00'); }
    }
  }

  waves = [];
  let cur = openMin;
  while(cur < closeMin){
    const stop = Math.min(cur+cadence, closeMin);
    waves.push({start:cur,stop,label:toHHMM(cur),capacity:cap,remaining:cap,booked:0,el:null});
    cur = stop;
  }

  renderWaves();
  highlightCurrentWave();
}

function renderWaves(){
  const scroll = document.getElementById('waveScroll');
  scroll.innerHTML='';
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes();
  const todayStr = todayISO();
  const isToday = getSelectedDate()===todayStr;

  waves.forEach(w=>{
    const past  = isToday && w.stop <= nowMin;
    const isCur = isToday && w.start<=nowMin && nowMin<w.stop;
    const full  = w.remaining<=0;

    const el = document.createElement('div');
    el.className = 'wave-card' + (full||past?' full':'') + (isCur?' now-tag':'');
    if(w===selectedWave) el.classList.add('sel');
    el.innerHTML=`
      <div class="wave-time">${esc(w.label)}</div>
      <div class="wave-window">${esc(toHHMM(w.start))}–${esc(toHHMM(w.stop))}</div>
      <div class="wave-rem">Left: <strong>${w.remaining}</strong></div>
      <div class="wave-count">${w.booked||1}</div>
      <div class="wave-controls">
        <button class="wave-minus" type="button">−</button>
        <button class="wave-plus"  type="button">+</button>
      </div>`;

    if(!full && !past){
      el.querySelector('.wave-plus').addEventListener('click',e=>{ e.stopPropagation(); selectWave(w); });
      el.querySelector('.wave-minus').addEventListener('click',e=>{ e.stopPropagation(); if(selectedWave===w){ selectedWave=null; renderWaves(); updateSelSummary(); updateBookBtn(); } });
      el.addEventListener('click',()=>{ selectWave(w); });
    }

    w.el=el;
    scroll.appendChild(el);
  });
}

function selectWave(w){
  selectedWave=w;
  waves.forEach(x=>x.el?.classList.remove('sel'));
  w.el?.classList.add('sel');
  document.getElementById('selTimeRow').style.display='';
  document.getElementById('selTime').textContent=`${w.label} – ${toHHMM(w.stop)}`;
  updateBookBtn();
  updateSelSummary();
}

function highlightCurrentWave(){
  const nowMin=new Date().getHours()*60+new Date().getMinutes();
  const idx=waves.findIndex(w=>w.start<=nowMin&&nowMin<w.stop)??waves.findIndex(w=>w.start>=nowMin);
  if(idx>=0 && waves[idx]?.el){
    setTimeout(()=>waves[idx].el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}),80);
  }
}

/* ── Summary & button state ─────────────────────────────── */
function updateSelSummary(){
  document.getElementById('selDate').textContent = getSelectedDate();
}
function updateBookBtn(){
  const btn=document.getElementById('bookBtn');
  const formula=queue?.booking_formula||'LIVE_ONLY';
  const arch=queue?.archetype||'D';
  let ready=false;

  if(arch==='D'){
    /* Continuous flow — just party size needed */
    ready=partySize>=1;
  } else if(formula==='LIVE_ONLY'&&(arch==='C'||arch==='B'||arch==='A')){
    /* Live slot selection */
    ready=!!selectedWave;
  } else {
    /* Advance or mixed — need date + wave */
    ready=!!selectedWave;
  }

  btn.disabled=!ready;
}

/* ── Render booking UI based on archetype ───────────────── */
function renderQueueUI(q){
  const formula=q.booking_formula||'LIVE_ONLY';
  const arch=q.archetype||'D';

  /* Show wave/slot section for non-continuous archetypes */
  if(arch!=='D'){
    document.getElementById('waveSection').style.display='';
    buildWaves(q);
  }

  /* Show date picker for advance bookings */
  if(formula!=='LIVE_ONLY'){
    initDatePicker(formula);
    document.getElementById('datePicker').addEventListener('change',()=>{
      selectedWave=null;
      buildWaves(q);
      updateSelSummary();
      updateBookBtn();
    });
  } else {
    initDatePicker('LIVE_ONLY');
  }

  /* Continuous flow (D) — just party size */
  if(arch==='D'){
    document.getElementById('waveSection').style.display='none';
    document.getElementById('bookBtn').disabled=false;
  }

  updateSelSummary();
  updateBookBtn();
}

/* ── Load queue ─────────────────────────────────────────── */
async function loadQueue(){
  /* Show placeholder info from URL params while loading */
  if(nameHint){
    document.getElementById('heroTitle').textContent=nameHint;
    if(addrHint) document.getElementById('heroAddr').textContent='📍 '+addrHint;
  }

  if(!queueId) return;

  try{
    const r=await fetch(`/api/intime/queues/${encodeURIComponent(queueId)}`);
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||`HTTP ${r.status}`);
    if(!d.ok||!d.queue) throw new Error('Queue not found');
    queue=d.queue;

    /* Update hero */
    document.getElementById('heroTitle').textContent=queue.name||nameHint||'Virtual Queue';
    document.getElementById('heroSub').textContent=queue.venue_name||'';
    document.getElementById('heroAddr').textContent=queue.location_text ? '📍 '+queue.location_text : (addrHint?'📍 '+addrHint:'');
    document.title=`Book — ${queue.name||'Queue'} — In-Time`;
    document.getElementById('selQueue').textContent=queue.name||'—';

    /* Hero pills */
    const archLabels={A:'Resource',B:'Individual',C:'Wave',D:'Continuous'};
    const fLabels={LIVE_ONLY:'Live',ADVANCE_ONLY:'Advance',MIXED:'Mixed'};
    const pills=[];
    if(queue.archetype) pills.push(archLabels[queue.archetype]||queue.archetype);
    if(queue.booking_formula) pills.push(fLabels[queue.booking_formula]||queue.booking_formula);
    if(queue.language) pills.push(queue.language.toUpperCase());
    document.getElementById('heroPills').innerHTML=pills.map(p=>`<span class="hero-pill">${esc(p)}</span>`).join('');

    /* Render booking UI */
    document.getElementById('bookingUI').style.display='';
    renderQueueUI(queue);

  }catch(err){
    setErr('Could not load queue: '+err.message);
    console.error('[booking] load error:',err);
  }
}

/* ── Confirm booking ─────────────────────────────────────── */
async function confirmBooking(){
  if(!queue){ toast('Queue not loaded yet'); return; }
  setErr('');
  const btn=document.getElementById('bookBtn');
  btn.disabled=true; btn.textContent='Booking…';

  const slotDate=getSelectedDate();
  const deviceId=getDeviceId();

  /* Build payload matching our API exactly */
  const payload={
    queue_id:  Number(queueId),
    device_id: deviceId,
    source:    queue.booking_formula==='LIVE_ONLY' ? 'live' : 'advance',
    slots:[{
      slot_date:  slotDate,
      party_size: partySize,
    }],
    include_qr: true,
  };

  try{
    const r=await fetch('/api/intime/bookings',{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok) throw new Error(d.error||`HTTP ${r.status}`);

    /* Success — show confirmation */
    const b=d.bookings?.[0];
    const code=formatCode(b?.human_ref);
    const qrImg=d.qr?.[0]?.image_base64||null;

    document.getElementById('confCode').textContent=code||'—';
    document.getElementById('confSub').textContent=
      `Your spot at ${queue.name||'the queue'} on ${slotDate} is confirmed.`
      +(partySize>1 ? ` (${partySize} people)` : '');

    if(qrImg){
      const qi=document.getElementById('confQr');
      qi.src=qrImg; qi.style.display='';
    }

    document.getElementById('bookingUI').style.display='none';
    document.getElementById('confScreen').style.display='';

  }catch(err){
    setErr('Booking failed: '+err.message);
    btn.disabled=false; btn.textContent='Confirm booking →';
  }
}

function formatCode(raw){
  if(!raw) return '';
  /* human_ref is 9 chars (alias8 + checksum1), display as XXX-XXX-XXX */
  const s=String(raw).toUpperCase().replace(/-/g,'');
  if(s.length===9) return s.slice(0,3)+'-'+s.slice(3,6)+'-'+s.slice(6);
  return s;
}

function bookAnother(){
  selectedWave=null; partySize=1;
  document.getElementById('psVal').textContent='1';
  document.getElementById('selPS').textContent='1';
  document.getElementById('confScreen').style.display='none';
  document.getElementById('bookingUI').style.display='';
  if(queue) renderQueueUI(queue);
}

/* ── Scroll buttons ─────────────────────────────────────── */
document.getElementById('waveLeft')?.addEventListener('click',()=>{
  document.getElementById('waveScroll').scrollBy({left:-320,behavior:'smooth'});
});
document.getElementById('waveRight')?.addEventListener('click',()=>{
  document.getElementById('waveScroll').scrollBy({left:320,behavior:'smooth'});
});

/* ── Boot ───────────────────────────────────────────────── */
loadQueue();

if(window.Drawer?.mount) Drawer.mount({mode:'visitor'});
if(window.FAB?.mount) FAB.mount({
  useTopBand:true, useBottomBand:true,
  home:  {label:'🏠', title:'Home',  onClick:()=>Drawer?.open?.()},
  config:{label:'↺',  title:'Reset', onClick:()=>bookAnother()},
  onBack:()=>history.length>1 ? history.back() : (location.href='/modules/In-Time/use/page 2.html'),
});
