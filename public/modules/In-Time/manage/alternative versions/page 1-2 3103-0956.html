<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Edit Queue — In-Time</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --v:#7c3aed;--v-s:#ede9fc;--v-d:#6d28d9;--white:rgb(255,255,255);
  --blue:#2563eb;--blue-s:#eff6ff;
  --green:#16a34a;--green-s:#f0fdf4;
  --amber:#d97706;--amber-s:#fffbeb;
  --red:#dc2626;--red-s:#fef2f2;
  --txt:#1a1825;--muted:#6b6880;--hint:#9b98aa;
  --surf:#fff;--bg:#f4f3f8;--bord:#e2e0ea;--bord-f:#7c3aed;
  --gray:#f0eff5;--gray-m:#d4d2de;
  --r:14px;--ri:9px;
  --sh:0 2px 16px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05);
  --ring:0 0 0 3px rgba(124,58,237,.18);
  --font:'DM Sans',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55}

/* ─── TOPBAR ─────────────────────────────────────────────── */
.topbar{
  background:var(--v);color:#fff;padding:10px 20px;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 12px rgba(124,58,237,.3);
  flex-shrink:0;
}
.topbar-title{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sub{font-size:11.5px;opacity:.7;white-space:nowrap}
.topbar a{color:#fff;text-decoration:none;font-weight:700;font-size:12px;padding:5px 12px;border:1.5px solid rgba(255,255,255,.4);border-radius:999px;white-space:nowrap;transition:background .15s}
.topbar a:hover{background:rgba(255,255,255,.15)}

/* ─── TAB BAND (segment selector — always visible) ────── */
.tab-band{
  position: sticky;
  top: 6.5%;
  background:var(--surf);border-bottom:1px solid var(--bord);
  padding:8px 14px;
  display:flex;gap:5px;overflow-x:auto;flex-shrink:0;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
  justify-content:space-around;
}
.tab-band::-webkit-scrollbar{display:none}
.tab{
  flex-shrink:0;display:inline-flex;align-items:center;gap:4px;
  padding:6px 12px;border-radius:999px;border:1.5px solid var(--bord);
  font-size:11px;font-weight:600;color:var(--muted);
  cursor:pointer;transition:all .15s;white-space:nowrap;background:var(--surf);
  text-decoration:none;user-select:none;
}
.tab:hover{border-color:var(--v);color:var(--v);background:var(--v-s)}
.tab.active{border-color:var(--v);color:#fff;background:var(--v);font-weight:700}
.tab.locked{
  cursor:default;
  border-style:dashed;border-color:var(--amber);color:var(--amber);background:var(--amber-s);
  opacity:.7;
}
.tab.locked.active{opacity:1;border-style:solid;background:var(--amber);color:#fff}
.tab .t-icon{font-size:12px}
.tab .t-lock{font-size:7px;margin-left:-1px}

/* ─── MAIN PANEL ─────────────────────────────────────── */
.main-panel{
  max-width:680px;width:100%;margin:0 auto;
  padding:0 16px 140px;
}
.seg-card{
  width:100%;margin:16px 0;
  background:var(--surf);border:1px solid var(--bord);
  border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;
}
.seg-hd{
  padding:14px 18px 12px;border-bottom:1px solid var(--bord);
  display:flex;align-items:center;gap:10px;
}
.seg-icon{font-size:17px;flex-shrink:0}
.seg-hd-body{flex:1;min-width:0}
.seg-title{font-size:14px;font-weight:700;color:var(--txt)}
.seg-sub{font-size:12px;color:var(--muted);margin-top:1px}
.seg-badge{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.seg-badge.locked{background:var(--amber-s);color:var(--amber);border:1.5px solid #fcd34d}
.seg-badge.opt{background:var(--blue-s);color:var(--blue);border:1.5px solid #93c5fd}
.seg-bd{padding:16px 18px}

/* locked overlay for immutable sections */
.seg-card.locked .seg-bd{position:relative;pointer-events:none;user-select:none}
.seg-card.locked .seg-bd::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.5);z-index:2}
.lock-notice{display:flex;align-items:center;gap:8px;background:var(--amber-s);border:1.5px solid #fcd34d;border-radius:var(--ri);padding:8px 12px;font-size:12px;color:var(--amber);font-weight:600;margin-bottom:10px}

/* ─── MANAGE LINKS (contextual feature links at bottom of segment) */
.manage-links{
  border-top:1px solid var(--bord);padding:12px 18px;
  display:flex;flex-wrap:wrap;gap:8px;
  background:linear-gradient(180deg,var(--gray) 0%,var(--surf) 100%);
}
.manage-link{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:var(--ri);border:1.5px solid var(--v);
  background:var(--v-s);color:var(--v);
  font-family:var(--font);font-size:12px;font-weight:700;
  cursor:pointer;transition:all .18s;text-decoration:none;white-space:nowrap;
}
.manage-link:hover{background:var(--v);color:#fff;transform:translateY(-1px);box-shadow:0 2px 8px rgba(124,58,237,.2)}
.manage-link .ml-icon{font-size:14px}

/* ─── STICKY SAVE BAR (always visible above FAB) ──────── */
.save-bar{
  position:fixed;
  bottom:8%;
  left:0;
  right:0;
  z-index:100;
  background:transparent;
  border-top:none;
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  gap:10px;
  box-shadow:none;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-family:var(--font);
  font-size:13px;
  font-weight:600;
  padding:9px 18px;
  border-radius:var(--ri);
  cursor:pointer;
  transition:all .18s;
  border:1.5px solid;
  text-decoration:none;
}

.btn-back{
  background:var(--white);
  color:var(--txt);
  border-color:var(--bord);
}
.btn-back:hover{background:var(--bord)}

.btn-save{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
  box-shadow:0 2px 8px rgba(22,163,74,.25);
}
.btn-save:hover{background:#15803d}
.btn-save.saving{opacity:.7;pointer-events:none}

.save-status{font-size:12px;color:var(--muted)}
.save-status.ok{color:var(--green)}
.save-status.err{color:var(--red)}/* ─── FORM ELEMENTS ──────────────────────────────────── */
.f{margin-bottom:14px}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--txt);margin-bottom:4px}
.req{color:var(--red)}
input[type=text],input[type=email],input[type=number],input[type=time],textarea,select{
  width:100%;padding:8px 10px;border:1.5px solid var(--bord);border-radius:var(--ri);
  font-family:var(--font);font-size:13.5px;color:var(--txt);background:var(--surf);
  outline:none;transition:border-color .18s,box-shadow .18s;
}
input:focus,select:focus,textarea:focus{border-color:var(--bord-f);box-shadow:var(--ring)}
.hint{font-size:11.5px;color:var(--hint);margin-top:3px}
.sep{border:none;border-top:1px solid var(--bord);margin:14px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row .f{flex:1;min-width:140px}
.co{padding:10px 14px;border-radius:var(--ri);font-size:12.5px;margin-top:10px}
.co-lock{background:var(--amber-s);border:1.5px solid #fcd34d;color:var(--amber)}
.co-note{background:var(--blue-s);border:1.5px solid #93c5fd;color:var(--blue)}
.co-info{background:var(--green-s);border:1.5px solid #86efac;color:var(--green)}
.errbar{background:var(--red-s);border:1.5px solid #fca5a5;border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--red);font-weight:500;margin-top:8px;display:none}
.errbar.on{display:block}

/* choice cards */
.cgrid{display:grid;gap:8px}
.c2{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.copt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1.5px solid var(--bord);border-radius:var(--r);padding:12px;cursor:pointer;position:relative;transition:border-color .18s,background .18s}
.copt input[type=radio],.copt input[type=checkbox]{position:absolute;opacity:0;pointer-events:none}
.copt:has(input:checked){border-color:var(--v);background:var(--v-s)}
.cchk{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bord-f);background:var(--surf)}
.copt:has(input:checked) .cchk{background:var(--v);border-color:var(--v)}
.copt:has(input:checked) .cchk::after{content:'✓';color:#fff;font-size:9px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.cicon{font-size:18px}.ctitle{font-size:12.5px;font-weight:700;color:var(--txt)}.cdesc{font-size:11.5px;color:var(--muted);line-height:1.4}

/* toggle */
.togrow{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bord)}
.togrow:last-child{border-bottom:none}
.togi{flex:1;min-width:0;margin-right:12px}
.tog-title{font-size:13px;font-weight:600;color:var(--txt)}
.tog-desc{font-size:11.5px;color:var(--muted);margin-top:1px}
.togsw{position:relative;display:inline-block;width:38px;height:20px;flex-shrink:0}
.togsw input{opacity:0;width:0;height:0}
.togtr{position:absolute;inset:0;background:var(--gray-m);border-radius:10px;transition:.25s;cursor:pointer}
.togtr::before{content:'';position:absolute;width:14px;height:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
input:checked+.togtr{background:var(--v)}
input:checked+.togtr::before{transform:translateX(18px)}

/* locked values */
.locked-val{display:inline-flex;align-items:center;gap:5px;background:var(--gray);border:1.5px solid var(--bord);border-radius:var(--ri);padding:5px 10px;font-size:12.5px;color:var(--muted);font-weight:500;margin:3px 3px 3px 0}

/* map */
#map{height:180px;border-radius:var(--ri);margin-bottom:8px;border:1.5px solid var(--bord);overflow:hidden}
.coords-preview{font-size:11px;color:var(--hint);margin-bottom:6px}
#advancedCoords{display:none;gap:10px;margin-bottom:10px}
#advancedCoords.show{display:flex}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dchip{background:var(--gray);border:1px solid var(--bord);border-radius:var(--ri);padding:5px 10px;min-width:100px}
.dchip-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);margin-bottom:2px}
.dchip-val{font-size:12.5px;color:var(--txt);font-weight:500}
.dchip-val.empty{color:var(--hint)}
.dchip-val select{background:none;border:none;padding:0;font-size:12.5px;color:var(--txt);width:100%;cursor:pointer;outline:none}
.imm{font-size:8px;font-weight:700;text-transform:uppercase;color:var(--amber);letter-spacing:.04em;margin-left:3px;background:var(--amber-s);border-radius:3px;padding:1px 4px}

/* schedule */
.shortcuts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.sc{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px solid var(--bord);border-radius:var(--ri);padding:6px 10px;cursor:pointer;font-size:11px;font-weight:600;text-align:center;transition:all .15s;min-width:72px}
.sc input{display:none}.sc.on{border-color:var(--v);background:var(--v-s);color:var(--v)}
.daychips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.dc{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--bord);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;background:var(--surf);color:var(--muted)}
.dc.on{background:var(--v);border-color:var(--v);color:#fff}

/* slots */
.slot-card{border:1.5px solid var(--bord);border-radius:var(--ri);padding:10px 12px;margin-bottom:8px;position:relative}
.slot-rm{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--hint);cursor:pointer;font-size:14px}
.slot-rm:hover{color:var(--red)}
.btn-add{background:none;border:1.5px dashed var(--bord-f);color:var(--v);border-radius:var(--ri);padding:6px 12px;font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;margin-top:4px}
.btn-add:hover{background:var(--v-s)}

/* collapsible */
.collbtn{background:none;border:none;font-family:var(--font);font-size:12px;color:var(--v);font-weight:600;cursor:pointer;padding:3px 0;display:flex;align-items:center;gap:3px}
.collarr{display:inline-block;transition:transform .2s;font-size:9px;color:var(--hint)}
.collbtn.open .collarr{transform:rotate(90deg)}
.collbody{display:none;padding-top:4px}.collbody.on{display:block}

@media(max-width:600px){
  .tab-band{padding:6px 10px;gap:4px}
  .tab{padding:5px 9px;font-size:10px}
  .main-panel{padding:0 10px 130px}
  .seg-card{margin:10px 0}
  .seg-bd{padding:12px 14px}
  .save-bar{padding:8px 12px;gap:6px}
  .btn{font-size:12px;padding:8px 14px}
}
</style>
</head>
<body>

<div class="topbar" id="topbar">
  <div style="flex:1;min-width:0">
    <div class="topbar-title" id="tb-title">Edit Queue</div>
    <div class="topbar-sub" id="tb-sub">Loading…</div>
  </div>
  <a href="../manage/page 2.html" id="backLink">← My Queues</a>
</div>

<div class="tab-band" id="tabBand"><!-- filled by JS --></div>

<div class="main-panel" id="mainPanel">
  <!-- single segment card rendered here -->
</div>

<!-- STICKY SAVE BAR — always visible -->
<div class="save-bar">
  <a class="btn btn-back" href="../manage/page 2.html" id="footerBack">← Return to My Queues</a>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="save-status" id="saveStatus"></span>
    <button type="button" class="btn btn-save" id="btnSave">💾 Save changes</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/drawer.js"></script>
<script src="/js/fab.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
const S={
  queue_name:'',internal_label:'',venue_name:'',
  address:'',lat:null,lng:null,
  timezone:'',home_region:'',language:'en',currency:'EUR',
  sched_pat:'wd9_5',
  schedule:{sameHours:true,globalOpen:'09:00',globalClose:'17:00',
    days:[{n:'Mon',on:true,open:'09:00',close:'17:00',breaks:[]},{n:'Tue',on:true,open:'09:00',close:'17:00',breaks:[]},{n:'Wed',on:true,open:'09:00',close:'17:00',breaks:[]},{n:'Thu',on:true,open:'09:00',close:'17:00',breaks:[]},{n:'Fri',on:true,open:'09:00',close:'17:00',breaks:[]},{n:'Sat',on:false,open:'09:00',close:'17:00',breaks:[]},{n:'Sun',on:false,open:'09:00',close:'17:00',breaks:[]}],
    cutoff:30,breaks:[],holidays:[],specials:[]},
  arch:null,formula:null,
  slots:[],wave_duration:15,wave_capacity:20,
  wave_cap_mode:'constant',wave_var_scope:'all',wave_schedule:[],
  flow_capacity:30,flow_cap_mode:'constant',
  release_mode:'manual',release_count:10,release_interval:15,release_time_span:60,
  fixed_release_scope:'all',release_schedule:[],flow_schedule:[],
  publics:['anonymous','registered'],
  access_req:false,bulk_invite:true,
  adm:'scan',scan_fallback:false,noscan_win:10,
  calling:{live:'single_next',adv_lead:10},
  show_eet:true,show_ete:false,early:{enabled:false,interval:30,max:3,window:30},
  channels:['email','inapp'],sender_email:'',show_desk_id:false,show_operator_name:true,
  extra_fields:[],payment_gate:false,payment_mode:'best_attempt',resellers:[],
  cal_sync:false,cal_provider:null,sync_horizon:90,
  manual_refresh:true,conf_review:true,bulk_res:true,notify_imp:true,
  use_host_wall:true,theme:'default',wallpaper_data:null,
  operators:[],identity_policy:null,
};
const ARCH={A:{label:'Distinct Resources',icon:'🪑'},B:{label:'Individual Practice',icon:'👤'},C:{label:'Wave-Based Venue',icon:'🏟️'},D:{label:'Continuous Flow',icon:'🌊'}};
const FORMULA_LABEL={LIVE_ONLY:'Live-flow',ADVANCE_ONLY:'In advance',MIXED:'Mixed'};

/* ═══════════════════════════════════════════════════════════
   SEGMENT DEFINITIONS
═══════════════════════════════════════════════════════════ */
const SEGS=[
  {id:'s0',  icon:'📋',title:'Basic info',       sub:'Name, venue, location, schedule',  locked:false,show:()=>true},
  {id:'s1',  icon:'🏗', title:'Queue type',        sub:'Archetype — locked after creation',locked:true, show:()=>true},
  {id:'s2a', icon:'📆',title:'Booking mode',      sub:'Live, advance, or both',           locked:true, show:()=>true},
  {id:'s2b', icon:'⚙️',title:'Capacity',          sub:'Slots, waves, or flow limits',     locked:false,show:()=>true},
  {id:'s3',  icon:'👥',title:'Access',            sub:'Who can join this queue',           locked:false,show:()=>true},
  {id:'s4',  icon:'🎫',title:'Admission',         sub:'Scan, calling, fallback',           locked:false,show:()=>true},
  {id:'s5',  icon:'⏱', title:'Time transparency', sub:'Wait estimates, early alerts',      locked:false,show:()=>true, opt:true},
  {id:'s6',  icon:'🔔',title:'Notifications',     sub:'Channels and sender',               locked:false,show:()=>true, opt:true},
  {id:'s7',  icon:'✅',title:'Verification',      sub:'Extra fields, payment',             locked:false,show:()=>true, opt:true},
  {id:'s8',  icon:'📅',title:'Calendar',          sub:'External calendar sync',            locked:false,show:()=>S.arch==='B',opt:true},
  {id:'sop', icon:'👤',title:'Operators',         sub:'Team & permissions',                locked:false,show:()=>true, opt:true},
  {id:'s9',  icon:'🎨',title:'Look & feel',       sub:'Theme and branding',                locked:false,show:()=>true, opt:true},
];

let _qid=new URLSearchParams(location.search).get('edit');
let _dirty=false, _map=null, _marker=null, _activeSeg=null;

function esc(s){const d=document.createElement('div');d.textContent=String(s??'');return d.innerHTML;}
function markDirty(){_dirty=true;setSaveStatus('');}
function setSaveStatus(msg,type=''){const el=document.getElementById('saveStatus');if(el){el.textContent=msg;el.className='save-status'+(type?' '+type:'');}}
function coll(bodyId,btn){const b=document.getElementById(bodyId);if(!b)return;const o=b.classList.toggle('on');btn.classList.toggle('open',o);}

/* ═══════════════════════════════════════════════════════════
   TAB BAND + NAVIGATION
═══════════════════════════════════════════════════════════ */
function buildTabs(){
  const band=document.getElementById('tabBand');
  band.innerHTML='';
  SEGS.filter(s=>s.show()).forEach(s=>{
    const t=document.createElement('div');
    t.className='tab'+(s.locked?' locked':'')+(s.id===_activeSeg?' active':'');
    t.dataset.seg=s.id;
    t.innerHTML=`<span class="t-icon">${s.icon}</span>${s.title}${s.locked?'<span class="t-lock">🔒</span>':''}`;
    t.addEventListener('click',()=>switchSeg(s.id));
    band.appendChild(t);
  });
}

function switchSeg(id){
  /* Collect current segment before switching */
  if(_activeSeg && !SEGS.find(s=>s.id===_activeSeg)?.locked){
    collectSegment(_activeSeg);
  }
  _activeSeg=id;
  /* Update tab highlights */
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.seg===id));
  /* Scroll active tab into view */
  const activeTab=document.querySelector(`.tab[data-seg="${id}"]`);
  activeTab?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  /* Render segment */
  renderSegment(id);
}

/* ═══════════════════════════════════════════════════════════
   RENDER SEGMENT — shows one card at a time
═══════════════════════════════════════════════════════════ */
function renderSegment(id){
  const panel=document.getElementById('mainPanel');
  const seg=SEGS.find(s=>s.id===id);
  if(!seg){panel.innerHTML='';return;}

  const renderer=RENDERERS[id];
  /* Build body HTML via renderer */
  let bodyHTML='';
  if(renderer) bodyHTML=renderer();

  /* Build manage links */
  const links=getManageLinks(id);
  const linksHTML=links.length?`<div class="manage-links">${links.map(l=>`<a class="manage-link" href="${l.href}" title="${l.title}"><span class="ml-icon">${l.icon}</span>${l.label}</a>`).join('')}</div>`:'';

  panel.innerHTML=`
    <div class="seg-card${seg.locked?' locked':''}">
      <div class="seg-hd">
        <span class="seg-icon">${seg.icon}</span>
        <div class="seg-hd-body"><div class="seg-title">${seg.title}</div><div class="seg-sub">${seg.sub}</div></div>
        ${seg.locked?'<span class="seg-badge locked">🔒 Immutable</span>':''}
        ${seg.opt&&!seg.locked?'<span class="seg-badge opt">Optional</span>':''}
      </div>
      <div class="seg-bd" id="seg-bd">${bodyHTML}</div>
      ${linksHTML}
    </div>`;

  /* Post-render wiring */
  if(WIRE[id]) WIRE[id]();

  /* Wire dirty tracking on all new inputs */
  panel.querySelectorAll('input,select,textarea').forEach(el=>{
    el.addEventListener('change',markDirty,{passive:true});
    el.addEventListener('input',markDirty,{passive:true});
  });
}

function getManageLinks(id){
  const links=[];
  if(id==='s6'){
    if(S.channels.includes('sms')||S.channels.includes('email')||S.channels.includes('wa'))
      links.push({icon:'📨',label:'Configure notifications',href:`../manage/functionalities/notifications.html?queue=${encodeURIComponent(_qid)}`,title:'Notification channel setup'});
  }
  if(id==='s3'){
    if(S.publics.includes('listed')) links.push({icon:'📋',label:'Manage listed visitors',href:`../manage/functionalities/list visitors.html?queue=${encodeURIComponent(_qid)}`,title:'Add/remove allowed visitors'});
  }
  if(id==='s7'){
    if(S.payment_gate) links.push({icon:'💳',label:'Setup payment gate',href:`../manage/functionalities/payment gates.html?queue=${encodeURIComponent(_qid)}`,title:'Connect payment provider'});
  }
  if(id==='s8'){
    if(S.cal_sync){
      links.push({icon:'📅',label:'View calendar',href:`../manage/functionalities/calendar.html?queue=${encodeURIComponent(_qid)}`,title:'Queue calendar view'});
      links.push({icon:'⚙️',label:'Sync settings',href:`../manage/functionalities/calendar sync.html?queue=${encodeURIComponent(_qid)}`,title:'Calendar sync configuration'});
    }
  }
  return links;
}

/* ═══════════════════════════════════════════════════════════
   SUB-RENDERERS

let _slotId=0;
let _durId=1000;
function newSlot(){_slotId++;return{id:_slotId,name:S.arch==='B'?'Consultation':'Table',duration:S.arch==='B'?30:60,durations:S.arch==='A'?[{id:_slotId*100+1,minutes:60}]:[],capacity:S.arch==='A'?4:1,occurrences:1};}
function addDur(slotId){const sl=S.slots.find(x=>x.id===slotId);if(!sl)return;if(!sl.durations)sl.durations=[];sl.durations.push({id:++_durId,minutes:60});renderSlots();markDirty();}
function removeDur(slotId,durId){const sl=S.slots.find(x=>x.id===slotId);if(!sl||!sl.durations||sl.durations.length<=1)return;sl.durations=sl.durations.filter(d=>d.id!==durId);renderSlots();markDirty();}
function renderSlots(){
  const list=document.getElementById('slot-list');if(!list)return;
  if(!S.slots.length)S.slots.push(newSlot());
  if(S.arch==='A'){
    list.innerHTML=S.slots.map(sl=>{
      if(!sl.durations||!sl.durations.length)sl.durations=[{id:sl.id*100+1,minutes:sl.duration||60}];
      if(!sl.occurrences)sl.occurrences=1;
      const durRows=sl.durations.map((d,di)=>`<div style="display:flex;align-items:center;gap:5px;margin-right:4px"><input type="number" class="slot-adur" data-slotid="${sl.id}" data-durid="${d.id}" min="5" max="480" value="${d.minutes}" style="width:62px"><span style="font-size:12px;color:var(--muted)">min</span>${di>0?`<button type="button" class="btn-rm" onclick="removeDur(${sl.id},${d.id})" style="font-size:12px;padding:1px 3px">✕</button>`:''}</div>`).join('');
      return `<div class="slot-card"><button type="button" class="slot-rm" data-rm="${sl.id}">✕</button>
        <div class="row" style="margin-bottom:6px">
          <div class="f"><label class="lbl">Name</label><input type="text" data-slot="${sl.id}" data-field="name" value="${esc(sl.name)}" placeholder="e.g. Bowling lane, Table for 4"></div>
          <div class="f" style="max-width:115px"><label class="lbl" style="font-size:12px">Indiv. per unit</label><input type="number" data-slot="${sl.id}" data-field="capacity" min="1" value="${sl.capacity||1}" style="width:62px"></div>
          <div class="f" style="max-width:105px"><label class="lbl" style="font-size:12px">No. of units</label><input type="number" data-slot="${sl.id}" data-field="occurrences" min="1" value="${sl.occurrences||1}" style="width:62px"></div>
        </div>
        <div class="f" style="margin-bottom:0">
          <label class="lbl" style="font-size:12px">Duration(s)</label>
          <div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:4px">${durRows}<button type="button" class="btn-link" style="font-size:11px;padding:2px 6px" onclick="addDur(${sl.id})">+ Add</button></div>
        </div>
      </div>`;
    }).join('');
    list.querySelectorAll('.slot-adur').forEach(el=>el.addEventListener('input',()=>{const sl=S.slots.find(x=>x.id==el.dataset.slotid);if(sl&&sl.durations){const d=sl.durations.find(d=>d.id==el.dataset.durid);if(d){d.minutes=parseInt(el.value)||60;markDirty();}}}));
  } else {

const GEO={FR:{tz:'Europe/Paris',region:'Europe — West',cur:'EUR'},GB:{tz:'Europe/London',region:'Europe — UK',cur:'GBP'},US:{tz:'America/New_York',region:'Americas — NA',cur:'USD'},DE:{tz:'Europe/Berlin',region:'Europe — Central',cur:'EUR'},ES:{tz:'Europe/Madrid',region:'Europe — South',cur:'EUR'},IT:{tz:'Europe/Rome',region:'Europe — South',cur:'EUR'},CA:{tz:'America/Toronto',region:'Americas — NA',cur:'CAD'},AU:{tz:'Australia/Sydney',region:'Asia-Pacific',cur:'AUD'},JP:{tz:'Asia/Tokyo',region:'Asia-Pacific',cur:'JPY'},BR:{tz:'America/Sao_Paulo',region:'Americas — SA',cur:'BRL'}};
function guessCc(lat,lng){if(lat>41&&lat<51&&lng>-5&&lng<9)return'FR';if(lat>50&&lat<59&&lng>-8&&lng<2)return'GB';if(lat>48&&lat<55&&lng>6&&lng<15)return'DE';if(lat>36&&lat<44&&lng>-9&&lng<3)return'ES';if(lat>37&&lat<47&&lng>7&&lng<19)return'IT';if(lat>25&&lat<70&&lng>-130&&lng<-60)return'US';if(lat>43&&lat<70&&lng>-85&&lng<-52)return'CA';if(lat>-44&&lat<-10&&lng>113&&lng<154)return'AU';if(lat>30&&lat<46&&lng>129&&lng<146)return'JP';if(lat>-34&&lat<5&&lng>-73&&lng<-34)return'BR';return'US';}
function setPin(lat,lng,cc){
  S.lat=lat;S.lng=lng;
  if(!_map)return;
  if(_marker)_marker.setLatLng([lat,lng]);else _marker=L.marker([lat,lng]).addTo(_map);
  _map.setView([lat,lng],14);
  const info=GEO[cc||guessCc(lat,lng)]||{tz:'UTC',region:'Global',cur:'USD'};
  if(!S.timezone){S.timezone=info.tz;S.home_region=info.region;}
  const tzEl=document.getElementById('chip-tz'),rgEl=document.getElementById('chip-region');
  if(tzEl){tzEl.textContent=S.timezone;tzEl.classList.remove('empty');}
  if(rgEl){rgEl.textContent=S.home_region;rgEl.classList.remove('empty');}
  const prevEl=document.getElementById('coordsPreview');
  if(prevEl)prevEl.textContent=`${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)}`;
}
function initMap(){
  const el=document.getElementById('map');if(!el)return;
  if(_map){_map.remove();_map=null;_marker=null;}
  _map=L.map('map').setView([S.lat||48.8566,S.lng||2.3522],S.lat?14:4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(_map);
  _map.on('click',e=>{setPin(e.latlng.lat,e.latlng.lng);reverseGeocode(e.latlng.lat,e.latlng.lng);markDirty();});
  if(S.lat&&S.lng)setPin(S.lat,S.lng);
}
let _acTimer;
function wireLocation(){
  const inp=document.getElementById('f-addr');
  inp?.addEventListener('input',()=>{clearTimeout(_acTimer);_acTimer=setTimeout(()=>doGeocode(inp.value),600);});
  const latEl=document.getElementById('f-lat'),lngEl=document.getElementById('f-lng');
  const mu=()=>{const la=parseFloat(latEl?.value),ln=parseFloat(lngEl?.value);if(Number.isFinite(la)&&Number.isFinite(ln)){setPin(la,ln);reverseGeocode(la,ln);markDirty();}};
  latEl?.addEventListener('input',mu);lngEl?.addEventListener('input',mu);
}
async function doGeocode(q){if(q.length<4)return;try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);const d=await r.json();if(d[0]){S.address=d[0].display_name;setPin(parseFloat(d[0].lat),parseFloat(d[0].lon),(d[0].address?.country_code||'').toUpperCase());const a=document.getElementById('f-addr');if(a)a.value=d[0].display_name;markDirty();}}catch(_){}}
async function reverseGeocode(lat,lng){try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}`);const d=await r.json();if(d?.display_name){S.address=d.display_name;const a=document.getElementById('f-addr');if(a)a.value=d.display_name;}}catch(_){}}

function collectSegment(id){
  if(id==='s0'){S.queue_name=(document.getElementById('f-qname')?.value||'').trim();S.venue_name=(document.getElementById('f-venue')?.value||'').trim();S.internal_label=(document.getElementById('f-internal')?.value||'').trim();S.language=document.getElementById('f-lang')?.value||'en';S.currency=document.getElementById('f-currency')?.value||'EUR';const a=document.getElementById('f-addr');if(a)S.address=a.value.trim();const o=document.getElementById('f-open'),c=document.getElementById('f-close'),cu=document.getElementById('f-cutoff');if(o)S.schedule.globalOpen=o.value;if(c)S.schedule.globalClose=c.value;if(cu)S.schedule.cutoff=parseInt(cu.value)||30;/* breaks/holidays/specials are already synced in real-time via their event handlers */}
  if(id==='s2b'){
    if(S.arch==='C'){
      S.wave_duration=parseInt(document.getElementById('f-wave-dur')?.value)||15;
      S.wave_capacity=parseInt(document.getElementById('f-wave-cap')?.value)||20;
      const wcm=document.querySelector('input[name=wcm]:checked');if(wcm)S.wave_cap_mode=wcm.value;
      const wvs=document.querySelector('input[name=wvs]:checked');if(wvs)S.wave_var_scope=wvs.value;
    }
    if(S.arch==='D'){
      S.flow_capacity=parseInt(document.getElementById('f-flow-cap')?.value)||30;
      const r=document.querySelector('input[name=release]:checked');if(r)S.release_mode=r.value;
      S.release_count=parseInt(document.getElementById('f-rel-count')?.value||document.getElementById('f-rc-planned')?.value)||10;
      S.release_interval=parseInt(document.getElementById('f-rel-int')?.value)||15;
      S.release_time_span=parseInt(document.getElementById('f-rspan')?.value)||60;
      const frs=document.querySelector('input[name=frs]:checked');if(frs)S.fixed_release_scope=frs.value;
    }
  }
  if(id==='s3'){/* publics are synced in real-time; collect extras */S.access_req=document.getElementById('tog-access-req')?.checked||false;S.bulk_invite=document.getElementById('tog-bulk-invite')?.checked??true;}
  if(id==='s4'){const a=document.querySelector('input[name=adm]:checked');if(a)S.adm=a.value;S.calling.adv_lead=parseInt(document.getElementById('f-adv-lead')?.value)||10;S.noscan_win=parseInt(document.getElementById('f-noscan-win')?.value)||10;S.scan_fallback=document.getElementById('tog-fallback')?.checked||false;}
  if(id==='s5'){S.show_ete=document.getElementById('tog-ete')?.checked??false;S.early.enabled=document.getElementById('tog-early')?.checked??false;}
  if(id==='s6'){S.channels=[];['email','inapp','sms','wa'].forEach(c=>{if(document.getElementById('ch-'+c)?.checked)S.channels.push(c);});S.sender_email=document.getElementById('f-sender')?.value||'';}
  if(id==='s7'){S.payment_gate=document.getElementById('tog-pay')?.checked||false;const pm=document.querySelector('input[name=pm]:checked');if(pm)S.payment_mode=pm.value;}
  if(id==='s8'){S.cal_sync=document.getElementById('tog-cal')?.checked||false;S.cal_provider=document.getElementById('f-calprov')?.value||null;S.sync_horizon=parseInt(document.getElementById('f-horizon')?.value)||90;}
  if(id==='sop'){S.show_desk_id=document.getElementById('tog-deskid')?.checked??false;}
  if(id==='s9'){S.use_host_wall=!(document.getElementById('tog-host-wall')?.checked);const th=document.querySelector('input[name=theme]:checked');if(th)S.theme=th.value;/* wallpaper_data already set by file input handler */}
}

  const p = {
    name:            S.queue_name,
    venue_name:      S.venue_name,
    internal_label:  S.internal_label || null,

    payment_gate:    S.payment_gate,
    payment_mode:    S.payment_mode || null,
    access_publics:  S.publics,
    channels:        S.channels,
    extra_fields:    S.extra_fields,
    /* schedule */
    schedule:        S.schedule,
    /* capacity */
    slots:           S.slots,
    wave_duration:   S.wave_duration,
    wave_capacity:   S.wave_capacity,
    wave_cap_mode:   S.wave_cap_mode,
    wave_var_scope:  S.wave_var_scope,
    wave_schedule:   S.wave_schedule,
    flow_capacity:   S.flow_capacity,
    flow_cap_mode:   S.flow_cap_mode,
    release_mode:    S.release_mode,
    release_count:   S.release_count,
    release_interval:S.release_interval,
    release_time_span:S.release_time_span,
    fixed_release_scope: S.fixed_release_scope,
    release_schedule:S.release_schedule,
    flow_schedule:   S.flow_schedule,
    /* calling + early */
    calling:         S.calling,
    early:           S.early,
    /* admission extras */
    noscan_win:      S.noscan_win,
    scan_fallback:   S.scan_fallback,
    /* access extras */
    access_req:      S.access_req,
    bulk_invite:     S.bulk_invite,
    /* look & feel */
    use_host_wall:   S.use_host_wall,
    wallpaper_data:  S.wallpaper_data || null,
    /* calendar extras */
    manual_refresh:  S.manual_refresh,
    conf_review:     S.conf_review,
    bulk_res:        S.bulk_res,
    notify_imp:      S.notify_imp,
    /* operators + resellers */
    operators:       S.operators,

async function saveAll(){
  if(!_qid){alert('No queue ID.');return;}
  collectSegment(_activeSeg);
  if(!S.queue_name){setSaveStatus('Queue name required','err');return;}
  const btn=document.getElementById('btnSave');
  btn.disabled=true;btn.textContent='Saving…';btn.classList.add('saving');
  setSaveStatus('Saving…');
  try{
    const res=await fetch(`/api/intime/queues/${encodeURIComponent(_qid)}`,{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildPayload())});
    const data=await res.json().catch(()=>null);
    if(!res.ok)throw new Error((data&&data.error)||`HTTP ${res.status}`);
    _dirty=false;btn.textContent='✓ Saved!';btn.classList.remove('saving');setSaveStatus('Saved ✓','ok');
    setTimeout(()=>{btn.disabled=false;btn.textContent='💾 Save changes';setSaveStatus('');},2200);
  }catch(err){btn.disabled=false;btn.textContent='💾 Save changes';btn.classList.remove('saving');setSaveStatus('Failed: '+err.message,'err');}
}

/* ═══════════════════════════════════════════════════════════
   LOAD + BOOT
═══════════════════════════════════════════════════════════ */
async function loadQueue(){
  if(!_qid){window.location.href='../manage/page 2.html';return;}
  try{
    const res=await fetch(`/api/intime/queues/${encodeURIComponent(_qid)}`,{credentials:'same-origin',headers:{Accept:'application/json'}});
    const data=await res.json().catch(()=>null);
    if(!res.ok||!data)throw new Error((data&&data.error)||`HTTP ${res.status}`);
    const r=data.queue||data;
    S.queue_name=r.name||'';S.venue_name=r.venue_name||'';S.internal_label=r.internal_label||'';
    S.language=r.language||'en';S.currency=r.currency||'EUR';S.timezone=r.timezone||'';
    S.home_region=r.home_region||'';S.arch=r.archetype||null;S.formula=r.booking_formula||null;
    S.adm=r.admission_mode||'scan';S.show_desk_id=!!r.show_desk_id;S.cal_sync=!!r.cal_sync;
    S.cal_provider=r.cal_provider||null;S.theme=r.theme||'default';S.identity_policy=r.identity_policy||null;
    if(r.location_geo&&(r.location_geo.lat||r.location_geo.lng)){S.lat=r.location_geo.lat;S.lng=r.location_geo.lng;}
    if(r.location_text)S.address=r.location_text;
    /* Safe JSON helper — handles TEXT (string) and JSONB (already parsed by pg driver) */
    function jp(v){if(v==null)return null;if(typeof v==='object')return v;try{return JSON.parse(v);}catch(_){return null;}}

    const pub=jp(r.publics_json);     if(Array.isArray(pub))S.publics=pub;
    const ef=jp(r.extra_fields_json); if(Array.isArray(ef))S.extra_fields=ef;
    if(typeof r.show_eet==='boolean')S.show_eet=r.show_eet;
    if(typeof r.show_ete==='boolean')S.show_ete=r.show_ete;
    if(typeof r.payment_gate==='boolean')S.payment_gate=r.payment_gate;
    const ch=jp(r.channels_json);     if(Array.isArray(ch))S.channels=ch;
    if(r.sender_email)S.sender_email=r.sender_email;
    if(r.sync_horizon)S.sync_horizon=r.sync_horizon;
    const sched=jp(r.schedule_json);  if(sched&&typeof sched==='object')Object.assign(S.schedule,sched);
    const sl=jp(r.slots_json);        if(Array.isArray(sl))S.slots=sl;
    if(r.wave_duration)S.wave_duration=r.wave_duration;if(r.wave_capacity)S.wave_capacity=r.wave_capacity;
    if(r.flow_capacity)S.flow_capacity=r.flow_capacity;if(r.release_mode)S.release_mode=r.release_mode;
    if(r.release_count)S.release_count=r.release_count;if(r.release_interval)S.release_interval=r.release_interval;

/* ═══════════════════════════════════════════════════════════
   CHART HELPERS — shared by wave (arch C) and release (arch D)
═══════════════════════════════════════════════════════════ */
function timeStrToMin(str){const p=(str||'0:0').split(':');return parseInt(p[0]||0)*60+parseInt(p[1]||0);}
function minToTimeStr(min){const h=Math.floor((min||0)/60),m=(min||0)%60;return h+':'+(m<10?'0':'')+m;}

function getChartOperatingHours(){
  const days=S.schedule.days.filter(d=>d.on);
  if(!days.length)return{start:9*60,end:18*60};
  const d=days[0];
  const [sh,sm]=(d.open||'9:00').split(':').map(Number);
  const [eh,em]=(d.close||'18:00').split(':').map(Number);
  return{start:sh*60+(sm||0),end:eh*60+(em||0)};
}

/* ── WAVE CHARTS (arch C variable mode) ── */
function ensureWaveSchedule(){
  const days=S.schedule.days.filter(d=>d.on);
  const{start,end}=getChartOperatingHours();
  const dur=Math.max(5,S.wave_duration||15);
  function makeSegs(){const s=[];for(let t=start;t<=end;t+=dur)s.push({time:t,cap:S.wave_capacity||20});return s;}
  if(S.wave_var_scope==='all'){
    if(!S.wave_schedule.find(ws=>ws.day==='All days'))S.wave_schedule.push({day:'All days',segments:makeSegs()});
    S.wave_schedule=S.wave_schedule.filter(ws=>ws.day==='All days');
    const ex=S.wave_schedule[0];
    if(ex&&ex.segments.length>1&&ex.segments[1].time-ex.segments[0].time!==dur)ex.segments=makeSegs();
  }else{
    days.forEach(d=>{
      const ex=S.wave_schedule.find(ws=>ws.day===d.n);
      if(!ex)S.wave_schedule.push({day:d.n,segments:makeSegs()});
      else if(ex.segments.length>1&&ex.segments[1].time-ex.segments[0].time!==dur)ex.segments=makeSegs();
    });
    S.wave_schedule=S.wave_schedule.filter(ws=>ws.day!=='All days'&&days.some(d=>d.n===ws.day));
  }
}

function drawWaveChart(day){
  const ws=S.wave_schedule.find(w=>w.day===day);if(!ws)return;
  const canvas=document.getElementById('wc-'+day);if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height,PAD={l:38,r:12,t:14,b:28};
  const cw=W-PAD.l-PAD.r,ch=H-PAD.t-PAD.b;
  const segs=ws.segments;
  const maxCap=Math.max(...segs.map(s=>s.cap),S.wave_capacity*2,10);
  const minT=segs[0].time,maxT=segs[segs.length-1].time,span=maxT-minT||1;
  const xOf=t=>PAD.l+((t-minT)/span)*cw;
  const yOf=c=>PAD.t+ch-(c/maxCap)*ch;
  const ptR=Math.max(2.5,Math.min(5,cw/(segs.length*3)));
  ctx.clearRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(99,91,167,0.18)';ctx.lineWidth=1;
  [0,.25,.5,.75,1].forEach(t=>{
    const y=PAD.t+ch*t;
    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(PAD.l+cw,y);ctx.stroke();
    ctx.fillStyle='rgba(160,155,210,0.55)';ctx.font='10px Arial';ctx.textAlign='right';
    ctx.fillText(Math.round(maxCap*(1-t)),PAD.l-4,y+3.5);
  });
  // Breaks
  const brkList=(day!=='All days')?(S.schedule.days.find(d=>d.n===day)?.breaks||[]):(S.schedule.breaks||[]);
  brkList.forEach(br=>{
    const bs=timeStrToMin(br.from||'0:0'),be=timeStrToMin(br.to||'0:0');
    if(bs<be&&bs>=minT&&bs<=maxT){
      const bx1=xOf(bs),bx2=Math.min(xOf(be),PAD.l+cw);
      ctx.fillStyle='rgba(239,68,68,0.10)';ctx.fillRect(bx1,PAD.t,bx2-bx1,ch);
      ctx.strokeStyle='rgba(239,68,68,0.28)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(bx1,PAD.t);ctx.lineTo(bx1,PAD.t+ch);ctx.stroke();
      ctx.beginPath();ctx.moveTo(bx2,PAD.t);ctx.lineTo(bx2,PAD.t+ch);ctx.stroke();
      ctx.fillStyle='rgba(239,68,68,0.5)';ctx.font='bold 9px Arial';ctx.textAlign='center';
      ctx.fillText('break',bx1+(bx2-bx1)/2,PAD.t+9);
    }
  });
  // Filled area
  const grad=ctx.createLinearGradient(0,PAD.t,0,PAD.t+ch);
  grad.addColorStop(0,'rgba(99,91,255,0.35)');grad.addColorStop(1,'rgba(99,91,255,0.04)');
  ctx.beginPath();ctx.moveTo(xOf(segs[0].time),yOf(segs[0].cap));
  for(let i=1;i<segs.length;i++)ctx.lineTo(xOf(segs[i].time),yOf(segs[i].cap));
  ctx.lineTo(xOf(segs[segs.length-1].time),PAD.t+ch);ctx.lineTo(xOf(segs[0].time),PAD.t+ch);
  ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  // Line
  ctx.beginPath();ctx.moveTo(xOf(segs[0].time),yOf(segs[0].cap));
  for(let i=1;i<segs.length;i++)ctx.lineTo(xOf(segs[i].time),yOf(segs[i].cap));
  ctx.strokeStyle='rgba(139,92,246,0.9)';ctx.lineWidth=2.5;ctx.stroke();
  // Points
  segs.forEach(seg=>{
    const x=xOf(seg.time),y=yOf(seg.cap);
    ctx.beginPath();ctx.arc(x,y,ptR,0,Math.PI*2);
    ctx.fillStyle='#a78bfa';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
  });
  // X labels inside canvas
  const xlabel=document.getElementById('wc-xlabel-'+day);if(xlabel)xlabel.style.display='none';
  const lstep=span>600?60:30,first=Math.ceil(minT/lstep)*lstep;
  ctx.font='10px Arial';ctx.textAlign='center';
  for(let t=first;t<=maxT;t+=lstep){
    const lx=xOf(t);
    ctx.strokeStyle='rgba(160,155,210,0.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(lx,PAD.t+ch);ctx.lineTo(lx,PAD.t+ch+4);ctx.stroke();
    ctx.fillStyle='rgba(160,155,210,0.75)';ctx.fillText(minToTimeStr(t),lx,H-6);
  }
}

function bindWaveChart(day){
  const canvas=document.getElementById('wc-'+day);
  const tooltip=document.getElementById('wc-tooltip-'+day);
  if(!canvas)return;
  const ws=S.wave_schedule.find(w=>w.day===day);
  let dragging=null;
  function getPos(e){const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;return{x:((e.touches?e.touches[0].clientX:e.clientX)-r.left)*sx,y:((e.touches?e.touches[0].clientY:e.clientY)-r.top)*sy};}
  function hitTest(p){
    const segs=ws.segments,W=canvas.width,H=canvas.height,PAD={l:38,r:12,t:14,b:28};
    const cw=W-PAD.l-PAD.r,ch=H-PAD.t-PAD.b;
    const maxCap=Math.max(...segs.map(s=>s.cap),S.wave_capacity*2,10);
    const minT=segs[0].time,maxT=segs[segs.length-1].time;
    const xOf=t=>PAD.l+((t-minT)/(maxT-minT||1))*cw,yOf=c=>PAD.t+ch-(c/maxCap)*ch;
    for(let i=0;i<segs.length;i++){const dx=p.x-xOf(segs[i].time),dy=p.y-yOf(segs[i].cap);if(Math.sqrt(dx*dx+dy*dy)<12)return i;}
    return null;
  }
  function updatePos(idx,p){
    const segs=ws.segments,H=canvas.height,PAD={l:38,r:12,t:14,b:28},ch=H-PAD.t-PAD.b;
    const maxCap=Math.max(...segs.map(s=>s.cap),S.wave_capacity*2,10);
    segs[idx].cap=Math.max(1,Math.min(Math.round(maxCap*(1-(p.y-PAD.t)/ch)),maxCap));
    drawWaveChart(day);markDirty();
    if(tooltip){tooltip.style.display='block';tooltip.style.left=(p.x/canvas.width*100)+'%';tooltip.style.top=Math.max(PAD.t,p.y-28)+'px';tooltip.textContent=minToTimeStr(segs[idx].time)+' → '+segs[idx].cap+' visitors';}
  }
  canvas.addEventListener('mousedown',e=>{const p=getPos(e),i=hitTest(p);if(i!==null){dragging=i;e.preventDefault();}});
  canvas.addEventListener('mousemove',e=>{const p=getPos(e);if(dragging!==null){updatePos(dragging,p);return;}canvas.style.cursor=hitTest(p)!==null?'grab':'crosshair';if(tooltip)tooltip.style.display='none';});
  canvas.addEventListener('mouseup',()=>{dragging=null;if(tooltip)tooltip.style.display='none';});
  canvas.addEventListener('mouseleave',()=>{dragging=null;if(tooltip)tooltip.style.display='none';});
  canvas.addEventListener('touchstart',e=>{const p=getPos(e),i=hitTest(p);if(i!==null){dragging=i;e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchmove',e=>{if(dragging!==null){updatePos(dragging,getPos(e));e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchend',()=>{dragging=null;});
}

function resetWaveDay(day){
  const ws=S.wave_schedule.find(w=>w.day===day);
  if(ws)ws.segments.forEach(s=>s.cap=S.wave_capacity||20);
  drawWaveChart(day);markDirty();
}

    const segs=rs.segments,W=canvas.width,H=canvas.height,PAD={l:38,r:12,t:14,b:28};
    const cw=W-PAD.l-PAD.r,ch=H-PAD.t-PAD.b;
    const maxCount=Math.max(S.release_count||10,...segs.map(s=>s.count),1);
    const minT=segs[0].time,maxT=segs[segs.length-1].time;
    const xOf=t=>PAD.l+((t-minT)/(maxT-minT||1))*cw,yOf=v=>PAD.t+ch-(v/maxCount)*ch;
    for(let i=0;i<segs.length;i++){const dx=p.x-xOf(segs[i].time),dy=p.y-yOf(segs[i].count);if(Math.sqrt(dx*dx+dy*dy)<12)return i;}
    return null;
  }
  function updatePos(idx,p){
    const segs=rs.segments,H=canvas.height,PAD={l:38,r:12,t:14,b:28},ch=H-PAD.t-PAD.b;
    const maxCount=Math.max(S.release_count||10,...segs.map(s=>s.count),1);
    segs[idx].count=Math.max(0,Math.min(Math.round(maxCount*(1-(p.y-PAD.t)/ch)),maxCount));
    drawReleaseChart(day);markDirty();
    if(tooltip){tooltip.style.display='block';tooltip.style.left=(p.x/canvas.width*100)+'%';tooltip.style.top=Math.max(PAD.t,p.y-28)+'px';tooltip.textContent=minToTimeStr(segs[idx].time)+' → '+segs[idx].count+' releases';}
  }
  canvas.addEventListener('mousedown',e=>{const p=getPos(e),i=hitTest(p);if(i!==null){dragging=i;e.preventDefault();}});
  canvas.addEventListener('mousemove',e=>{const p=getPos(e);if(dragging!==null){updatePos(dragging,p);return;}canvas.style.cursor=hitTest(p)!==null?'grab':'crosshair';if(tooltip)tooltip.style.display='none';});
  canvas.addEventListener('mouseup',()=>{dragging=null;if(tooltip)tooltip.style.display='none';});
  canvas.addEventListener('mouseleave',()=>{dragging=null;if(tooltip)tooltip.style.display='none';});
  canvas.addEventListener('touchstart',e=>{const p=getPos(e),i=hitTest(p);if(i!==null){dragging=i;e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchmove',e=>{if(dragging!==null){updatePos(dragging,getPos(e));e.preventDefault();}},{passive:false});
  canvas.addEventListener('touchend',()=>{dragging=null;});
}

function resetReleaseDay(day){
  const rs=S.release_schedule.find(r=>r.day===day);
  if(rs)rs.segments.forEach(s=>s.count=S.release_count||10);
  drawReleaseChart(day);markDirty();
}
</script>
